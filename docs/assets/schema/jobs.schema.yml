x-page: jobs.md
$defs:
  job:
    type: object
    required:
      - name
      - plan
    additionalProperties: false
    properties:
      name:
        $ref: '#/$defs/identifier'
        description: The name of the job. This should be short; it will show up in URLs. If you want to
          rename a job, use `job.old_name`.
      plan:
        $comment: The field is `plan` (atc.JobConfig, the release notes and every example). The jobs page
          heading used to say `steps` (concourse/docs#627).
        type: array
        items:
          $ref: '#/$defs/step'
        description: The sequence of [steps](steps/index.md) to execute.
      old_name:
        $ref: '#/$defs/identifier'
        description: |-
          The old name of the job. This can be used to rename a job without losing its history, like so:

          ```yaml
          jobs:
            - name: new-name
              old_name: current-name
              plan:
                - get: 10m
          ```

          After the pipeline is set, because the builds have been transferred, the job can have the field removed:

          ```yaml
          jobs:
            - name: new-name
              plan:
                - get: 10m
          ```
      serial:
        $ref: '#/$defs/boolean'
        description: _Default `false`_. If set to `true`, builds will queue up and execute one-by-one,
          rather than executing in parallel.
      serial_groups:
        $ref: '#/$defs/stringList'
        description: |-
          _Default `[]`_. When set to an array of arbitrary tag-like strings, builds of this job and other jobs referencing
          the same tags will be serialized. Only affects jobs in the same pipeline.
        x-type: '[`[identifier]`](config-basics.md#identifier-schema)'
      max_in_flight:
        $ref: '#/$defs/number'
        description: |-
          If set, specifies a maximum number of builds to run at a time. If `serial` or `serial_groups` are set, they take
          precedence and force this value to be `1`.
      build_log_retention:
        type: object
        additionalProperties: false
        properties:
          days:
            $ref: '#/$defs/number'
            description: Keep logs for builds which have finished within the specified number of days.
          builds:
            $ref: '#/$defs/number'
            description: Keep logs for the last specified number of builds.
          minimum_succeeded_builds:
            $ref: '#/$defs/number'
            description: |-
              Keep a minimum number of successful build logs that would normally be reaped.

              Requires `builds` to be set to an integer higher than 0 in order to work. For example, if `builds` is set to 5,
              and this attribute to 1, say a job has the following build history: 7(f), 6(f), 5(f), 4(f), 3(f), 2(f), 1(s),
              where f means failed and s means succeeded, then builds 2 and 3 will be reaped, because it retains 5 build logs,
              and at least 1 succeeded build log. Default is 0.
        description: |-
          Configures the retention policy for build logs. This is useful if you have a job that runs often but after some
          amount of time the logs aren't worth keeping around.

          Builds which are not retained by the configured policy will have their logs reaped. If this configuration is
          omitted, logs are kept forever (unless [Build log retention](install/running-web.md#build-log-retention) is
          configured globally).

          When both `days` and `builds` are configured, a build's logs will only be
          reaped if it's older than the `days` specified.
        x-type-label: build_log_retention_policy
      public:
        $ref: '#/$defs/boolean'
        description: |-
          _Default `false`_. If set to `true`, the build log of this job will be viewable by unauthenticated users.
          Unauthenticated users will always be able to see the inputs, outputs, and build status history of a job. This is
          useful if you would like to expose your pipeline publicly without showing sensitive information in the build log.

          !!! note

              When this is set to `true`, any [`get` step](steps/get.md) and [`put` steps](steps/put.md) will show the
              metadata for their resource version, regardless of whether the resource itself has set
              [`resource.public`](resources/index.md#resource-schema) to `true`.
      disable_manual_trigger:
        $ref: '#/$defs/boolean'
        description: |-
          _Default `false`_. If set to `true`, manual triggering of the job (via the web UI or
          [`fly trigger-job`](#fly-trigger-job)) will be disabled.
      disable_reruns:
        $ref: '#/$defs/boolean'
        description: |-
          _Default `false`_. If set to `true`, rerunning builds of the job (via the
          web UI or [`fly rerun-build`](#fly-rerun-build)) will be disabled.
      interruptible:
        $ref: '#/$defs/boolean'
        description: |-
          _Default `false`_. Normally, when a worker is shutting down it will wait for builds with containers running on that
          worker to finish before exiting. If this value is set to `true`, the worker will not wait on the builds of this job.
          You may want this if you have a self-deploying Concourse or long-running-but-low-importance jobs.
      tags:
        $ref: '#/$defs/stringList'
        description: |-
          _⚠️ Only in v8.3.0 or higher_

          _Default `[]`_. The tags by which to match workers. All steps and `on_*`
          hook steps for the job will be placed within the pool of workers that match
          all the given set of tags.

          Child steps can override these `tags` with their own set of `tags`. Tags
          cannot be cleared by child steps though. You'll need to create a more
          granular job plan if you want certain steps to remain untagged.
      on_success:
        $ref: '#/$defs/step'
        description: |-
          Step to execute when the job succeeds. Equivalent to the [`on_success`](steps/modifier-and-hooks/on-success.md)
          hook.
        x-heading: 4
        x-group:
          text: Job Hooks
          level: 3
      on_failure:
        $ref: '#/$defs/step'
        description: |-
          Step to execute when the job fails. Equivalent to the [`on_failure`](steps/modifier-and-hooks/on-failure.md)
          hook.
        x-heading: 4
        x-group:
          text: Job Hooks
          level: 3
      on_error:
        $ref: '#/$defs/step'
        description: |-
          Step to execute when the job errors. Equivalent to the [`on_error`](steps/modifier-and-hooks/on-error.md)
          hook.
        x-heading: 4
        x-group:
          text: Job Hooks
          level: 3
      on_abort:
        $ref: '#/$defs/step'
        description: |-
          Step to execute when the job aborts. Equivalent to the [`on_abort`](steps/modifier-and-hooks/on-abort.md)
          hook.
        x-heading: 4
        x-group:
          text: Job Hooks
          level: 3
      ensure:
        $ref: '#/$defs/step'
        description: |-
          Step to execute regardless of whether the job succeeds, fails, errors, or aborts. Equivalent to the
          [`ensure`](steps/modifier-and-hooks/ensure.md) hook.
        x-heading: 4
        x-group:
          text: Job Hooks
          level: 3
      build_logs_to_retain:
        $ref: '#/$defs/number'
        deprecated: true
        description: Deprecated in favor of `build_log_retention`. Keep logs for the last this-many builds.
        x-docs: false
    x-type-label: job