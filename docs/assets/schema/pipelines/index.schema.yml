x-page: pipelines/index.md
$defs:
  pipeline:
    x-type-label: pipeline
    type: object
    required:
    - jobs
    additionalProperties: false
    patternProperties:
      ^x-:
        description: Escape hatch for YAML-anchor holder keys. Docs say unknown top-level keys are dropped
          by Concourse, not rejected; strictness here is a linting choice.
    properties:
      jobs:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/job'
        description: |-
          A set of [jobs](../jobs.md) for the pipeline to continuously schedule. At least one job is required for
          a pipeline to be valid.
      resources:
        type: array
        items:
          $ref: '#/$defs/resource'
        description: A set of resources for the pipeline to continuously check.
      resource_types:
        type: array
        items:
          $ref: '#/$defs/resourceType'
        description: A set of resource types for resources within the pipeline to use.
      var_sources:
        type: array
        items:
          $ref: '#/$defs/varSource'
        description: A set of Var sources for the pipeline to use.
      groups:
        type: array
        items:
          type: object
          required:
          - name
          additionalProperties: false
          properties:
            name:
              $ref: '#/$defs/identifier'
              description: A unique name for the group. This should be short and simple as it will be
                used as the tab name for navigation.
              x-required-text: false
            jobs:
              type: array
              items:
                $ref: '#/$defs/string'
              description: |-
                A list of jobs that should appear in this group. A job may appear in multiple groups. Neighbours of jobs in the
                current group will also appear on the same page in order to give context of the location of the group in
                the pipeline.

                You may also use any valid [glob](https://www.man7.org/linux/man-pages/man7/glob.7.html) to represent several
                jobs, e.g.:

                ```yaml
                groups:
                  - name: develop
                    jobs:
                      - terraform-*
                      - test
                      - deploy-{dev,staging}
                  - name: ship
                    jobs:
                      - deploy-prod
                  - name: all
                    jobs:
                      - "*"
                ```

                In this example, the `develop` group will match `terraform-apply`, `terraform-destroy`, `test`, `deploy-dev`,
                `deploy-staging`. The `ship` group will only match `deploy-prod`. The `all` group will match all jobs in the
                pipeline.

                !!! warning "Note"

                    Depending on how it's used, *, {, and } have special meaning in YAML, and may need to be quoted
                    (as was done in the all job above)
              x-type: '[`job.name`]'
          x-type-label: group_config
        description: |-
          A list of job groups to use for organizing jobs in the web UI.

          Groups have no functional effect on your pipeline. They are purely for making it easier to grok large pipelines
          in the web UI.

          !!! note

              Once you have added groups to your pipeline, all jobs must be in a group.
        x-type: '[`[group]`](#group_config-schema)'
        x-heading: false
      display:
        type: object
        additionalProperties: false
        properties:
          background_image:
            $ref: '#/$defs/string'
            description: Allows users to specify a custom background image for the pipeline. Must be an
              http, https, or relative URL.
          background_filter:
            $ref: '#/$defs/string'
            description: |-
              Default _`opacity(30%) grayscale(100%)`_. Allows users to specify custom
              [CSS filters](https://developer.mozilla.org/en-US/docs/Web/CSS/filter) that are applied to the
              `background_image`.
        description: Visual configurations for personalizing your pipeline.
        x-type-label: display_config
        x-heading: false
      user_data:
        $ref: '#/$defs/value'
        description: |-
          This field is meant to store arbitrary metadata. Its value can be any type
          you can express in YAML, even a string. The data in this field is NOT
          exposed in the pipeline during runtime. You can reference the data using YAML
          anchors when setting your pipelines.

          The main benefit of this field is having a way to preserve arbitrary data
          that will survive the `fly set-pipeline/get-pipeline` lifecycle. Any other
          top-level keys are not preserved by Concourse.
        x-heading: false
      prototypes:
        $comment: Present in atc.Config but not in the published docs. Shape assumed to mirror resource_types.
        type: array
        items:
          $ref: '#/$defs/resourceType'
        x-docs: false
